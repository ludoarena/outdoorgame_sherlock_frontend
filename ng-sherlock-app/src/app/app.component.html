<h1>List of users</h1>

<input #input (keyup.enter)="selectUser(input.value)" type="number" />

@if (selectedUser) {
  <p>{{ `You have selected the user: ${buildFullName(selectedUser)}` }}</p>
} @else {
  <p>No user has been found</p>
}

<p>{{ users[0].lastName }}</p>
<p>{{ users[1].lastName }}</p>
<p>{{ users[2].lastName }}</p>
<p>{{ users[3].lastName }}</p>

<router-outlet />
